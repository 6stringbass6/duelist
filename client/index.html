<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="screen-orientation" content="landscape" />
<meta name="x5-orientation" content="landscape" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#0b0f18" />
<title>GRIDSTRIKE</title>
<style>
:root{--bg:#0b0f18;--panel:#141a26;--panel2:#1b2332;--line:#2a3447;--txt:#e8edf5;--mut:#8b97ab;--acc:#ff4655;--acc2:#28e0ff;--ally:#3b9cff;--enemy:#ff4655;--gold:#ffd23f;--ok:#3ddc84}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans KR",sans-serif;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:8px 14px}
button:hover{border-color:#44536e}button:disabled{opacity:.45;cursor:not-allowed}
button.pri{background:var(--acc);border-color:var(--acc);font-weight:700}button.ghost{background:transparent}button.sm{padding:4px 10px;font-size:13px}
button.on{border-color:var(--acc2);color:var(--acc2)}
input,select{font:inherit;color:var(--txt);background:#0e131d;border:1px solid var(--line);border-radius:6px;padding:8px 10px;user-select:text;-webkit-user-select:text}
input[type=range]{padding:0;accent-color:var(--acc)}input[type=color]{padding:0;width:38px;height:30px}
.hidden{display:none!important}.mut{color:var(--mut)}.row{display:flex;align-items:center;gap:10px}.col{display:flex;flex-direction:column;gap:10px}.grow{flex:1}.right{margin-left:auto}
#app{position:fixed;inset:0}
#stage{position:absolute;inset:0;outline:none}#stage canvas{display:block;width:100%;height:100%}
#xhair{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:8;image-rendering:pixelated}
.screen{position:absolute;inset:0;z-index:20;overflow:auto;touch-action:pan-y;background:radial-gradient(1200px 600px at 50% -10%,#1b2540 0,var(--bg) 60%)}
/* ── auth */
#auth{display:flex;align-items:center;justify-content:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px}
#auth .card{width:min(380px,92vw)}#auth h1{margin:0 0 4px;letter-spacing:4px;font-size:30px}#auth h1 b{color:var(--acc)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{flex:1;white-space:nowrap}.tabs button.on{background:var(--panel);border-color:var(--acc);color:#fff}
.google{background:#fff;color:#222;border-color:#fff;font-weight:600;width:100%}.err{color:#ff7b86;font-size:13px;min-height:18px}
/* ── lobby */
#lobby-top{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:10px 16px;background:rgba(11,15,24,.9);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
#btn-play{padding:6px 22px;font-size:14px;font-weight:800;letter-spacing:2px;background:var(--acc);border-color:var(--acc);border-radius:4px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);font-size:13px;white-space:nowrap}
#lobby-nav{display:flex;gap:6px;padding:10px 16px;overflow-x:auto}#lobby-body{padding:6px 16px 40px;max-width:1100px;margin:0 auto}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}.grid.wide{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
h2{margin:18px 0 10px;font-size:17px}h3{margin:0 0 6px;font-size:15px}
.banner{position:relative;border-radius:14px;padding:26px;border:1px solid var(--line);overflow:hidden;min-height:150px}
.banner .tag{font-size:12px;letter-spacing:3px;color:var(--gold)}.banner h3{font-size:28px;margin:6px 0}
.skin{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.skin .sw{height:74px;position:relative}.skin .sw::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.5))}
.skin .inf{padding:10px;display:flex;flex-direction:column;gap:6px}.skin .nm{font-weight:700;font-size:14px}.rar{font-size:11px;font-weight:700;letter-spacing:1px}
.bar{height:8px;border-radius:99px;background:#0e131d;overflow:hidden}.bar>i{display:block;height:100%;background:var(--acc2)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{padding:10px 4px;text-align:center;border-radius:8px;background:var(--panel2);border:1px solid var(--line);font-size:12px}
.day.done{opacity:.5}.day.today{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
table{border-collapse:collapse;width:100%}th,td{padding:6px 8px;text-align:left;font-size:13px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:600}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}.stat b{display:block;font-size:24px}
/* ── modal */
.modal{position:absolute;inset:0;z-index:40;background:rgba(5,8,14,.72);display:flex;align-items:center;justify-content:center;padding:12px;touch-action:pan-y}
.modal>.card{width:min(760px,96vw);max-height:92vh;overflow:auto}.modal>.card.sm{width:min(400px,94vw)}
.mh{display:flex;align-items:center;margin-bottom:12px}.mh h3{font-size:18px;margin:0}.mh .x{margin-left:auto;border:none;background:none;font-size:20px;padding:0 6px}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}@media(max-width:700px){.modes{grid-template-columns:repeat(2,1fr)}}
.mode{padding:16px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;min-height:110px}.mode.on{border-color:var(--acc);background:#2a1a22}
.mode b{font-size:17px}.mode small{display:block;color:var(--mut);margin-top:6px;font-size:12px;line-height:1.4}.badge{font-size:10px;background:var(--gold);color:#000;border-radius:3px;padding:1px 5px;margin-left:6px;vertical-align:middle}
.set-row{display:grid;grid-template-columns:170px 1fr 70px;gap:10px;align-items:center;padding:6px 0}.set-row>span:last-child{text-align:right;color:var(--mut);font-size:13px}
.kb{display:grid;grid-template-columns:1fr 110px 110px;gap:6px;align-items:center;padding:3px 0}.kb button{padding:6px}.kb button.wait{border-color:var(--gold);color:var(--gold)}
.swatch{width:26px;height:26px;border-radius:5px;border:2px solid transparent;padding:0}.swatch.on{border-color:#fff}
#xh-preview{background:repeating-conic-gradient(#3a4a3a 0 25%,#55665a 0 50%) 0 0/40px 40px;border-radius:8px;width:100%;height:120px;image-rendering:pixelated}
/* ── support */
#sup-body{height:min(52vh,420px);overflow:auto;padding:4px}#sup-foot{margin-top:10px;display:flex;gap:8px}#sup-foot input{flex:1}
.sup-msg{max-width:82%;padding:8px 12px;border-radius:10px;margin:6px 0;font-size:14px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.sup-msg.sys{background:var(--panel2);border:1px solid var(--line)}.sup-msg.me{margin-left:auto;background:#1b2a44;border:1px solid var(--line)}
.sup-msg small{display:block;color:var(--mut);font-size:11px;margin-top:4px}
.tk{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px}.tk.done{opacity:.55}
.tk .tm{white-space:pre-wrap;word-break:break-word;margin:6px 0;font-size:14px}.tk .tb{display:flex;gap:6px;justify-content:flex-end}
/* ── gacha */
#gacha-win{position:relative;height:120px;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:#0a0e16}
#gacha-strip{display:flex;height:100%;will-change:transform}#gacha-strip>div{flex:0 0 120px;height:100%;border-right:1px solid #000;display:flex;align-items:flex-end;padding:6px;font-size:11px;font-weight:700}
#gacha-win::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1px;background:var(--gold);box-shadow:0 0 12px var(--gold)}
#gacha-result{text-align:center;padding:14px 0;min-height:70px}@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}.pop{animation:pop .35s ease-out}
/* ── HUD */
#hud{position:absolute;inset:0;z-index:10;pointer-events:none;font-variant-numeric:tabular-nums}
#hud-top{position:absolute;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;background:rgba(10,14,22,.6);padding:6px 16px;border-radius:8px;pointer-events:auto}
#hud-top .s{font-size:24px;font-weight:800;min-width:34px;text-align:center}#hud-sa{color:var(--ally)}#hud-sb{color:var(--enemy)}#hud-mid{text-align:center;font-size:12px;color:var(--mut)}#hud-timer{font-size:17px;color:#fff;font-weight:700}
#killfeed{position:absolute;top:calc(10px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right));display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.kf{background:rgba(10,14,22,.7);padding:4px 10px;border-radius:4px;font-size:13px;border-left:3px solid transparent;white-space:nowrap}.kf.mine{border-left-color:var(--gold);background:rgba(60,50,10,.75)}
.kf .a{color:var(--ally)}.kf .e{color:var(--enemy)}.kf .w{color:var(--mut);margin:0 6px}.kf .hs{color:var(--gold)}
#hud-banner{position:absolute;top:18%;left:50%;transform:translateX(-50%);font-size:26px;font-weight:800;letter-spacing:3px;text-shadow:0 2px 12px #000;text-align:center}
#hud-banner small{display:block;font-size:13px;font-weight:500;letter-spacing:0;color:#cfd8e6;margin-top:4px}
#hud-bl{position:absolute;left:calc(18px + env(safe-area-inset-left));bottom:calc(16px + env(safe-area-inset-bottom));display:flex;align-items:flex-end;gap:12px}
#hud-hp{font-size:40px;font-weight:800;line-height:1}#hud-hpbar{width:180px;height:8px;background:rgba(0,0,0,.5);border-radius:4px;overflow:hidden}#hud-hpbar i{display:block;height:100%;background:#fff}
#hud-br{position:absolute;right:calc(18px + env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));text-align:right}
#hud-ammo{font-size:40px;font-weight:800;line-height:1}#hud-ammo small{font-size:18px;color:var(--mut)}#hud-weapon{font-size:13px;color:var(--mut)}
#hud-slots{display:flex;gap:4px;justify-content:flex-end;margin-top:6px;pointer-events:auto}#hud-slots div{padding:3px 8px;font-size:12px;border-radius:4px;background:rgba(10,14,22,.6);border:1px solid transparent}#hud-slots div.on{border-color:#fff}
#hud-skills{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:10px}
.sk{position:relative;width:54px;height:54px;border-radius:8px;background:rgba(10,14,22,.65);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;overflow:hidden}
.sk b{font-size:17px;line-height:1;margin-top:1px}.sk.ult{border-color:#b06bff}.sk.ult.rdy{box-shadow:0 0 12px #b06bff;border-color:#e0b8ff}.sk.off{opacity:.45;filter:grayscale(.8)}
.sk small{font-size:10px;font-weight:500;color:var(--mut)}
#hud-skills{gap:8px}.sk{width:60px;height:60px}.sk span{position:absolute;left:4px;top:2px;font-size:11px;color:var(--mut)}
#hud-ult{position:absolute;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:3px}
#ult-pips{display:flex;gap:4px}#ult-pips i{width:22px;height:7px;border-radius:2px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25)}#ult-pips i.on{background:#b06bff;border-color:#e0b8ff;box-shadow:0 0 6px #b06bff}
#ult-name{font-size:11px;color:var(--mut)}#ult-name.rdy{color:#e0b8ff;font-weight:700}
#hud-status{position:absolute;left:50%;bottom:calc(112px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:6px}
#hud-status span{padding:2px 8px;border-radius:10px;font-size:12px;font-weight:700;background:rgba(10,14,22,.78);border:1px solid var(--line)}
#hud-status .sil{color:#e0b8ff;border-color:#b06bff;animation:silp 1s infinite alternate}@keyframes silp{to{box-shadow:0 0 10px #b06bff}}
#hud-status .amp{color:#ff6b6b;border-color:#ff4655}#hud-status .heal{color:#6bffa8;border-color:#3dd68c}#hud-status .shd{color:#5ef0ff;border-color:#5ef0ff}#hud-status .drift{color:#9db4ff;border-color:#6b84ff}
#hud-cast{position:absolute;left:50%;top:62%;transform:translateX(-50%);width:220px;text-align:center;font-weight:700;font-size:13px}
#cast-bar{height:6px;margin-top:4px;background:rgba(255,255,255,.2);border-radius:3px;overflow:hidden}#cast-bar i{display:block;height:100%;background:#fff}
#tac-canvas{width:min(640px,88vw);height:min(640px,88vw);background:#0b1018;border:1px solid var(--line);cursor:crosshair;display:block;margin:0 auto}
.slotrow{display:flex;gap:10px;flex-wrap:wrap}.eqslot{flex:1;min-width:150px;padding:10px;border:2px dashed var(--line);border-radius:10px;cursor:pointer;background:rgba(255,255,255,.03)}
.eqslot.sel{border-style:solid;border-color:var(--acc2)}.eqslot b{font-size:22px;display:block}.eqslot small{color:var(--mut)}
.skcard{padding:10px;border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;gap:4px}.skcard.on{border-color:var(--ok)}.skcard .ic{font-size:22px}.sk i{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.72)}.sk.act{border-color:var(--acc2);box-shadow:0 0 10px var(--acc2)}
#killbanner{position:absolute;left:50%;top:68%;transform:translateX(-50%);pointer-events:none;display:flex;flex-direction:column;align-items:center}
#killbanner .kb{display:flex;flex-direction:column;align-items:center;animation:kbpop .15s ease-out,kbfade .4s ease-in 2.1s forwards;filter:drop-shadow(0 0 8px var(--kc))}
#killbanner .kb svg{width:190px;height:78px;overflow:visible}
#killbanner .kb b{font:800 13px/1 sans-serif;letter-spacing:.2em;color:var(--kc);margin-top:-2px;text-shadow:0 0 6px #000}
#killbanner .kb.hs{--kc:#ff3b4a}
#killbanner .kb.hs svg{animation:kbshake .25s}
#killbanner .kb.ace svg{animation:kbglow 1s ease-in-out infinite alternate}
@keyframes kbpop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.25);opacity:1}100%{transform:scale(1)}}
@keyframes kbfade{to{opacity:0;transform:translateY(8px)}}
@keyframes kbshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes kbglow{to{filter:brightness(1.6) drop-shadow(0 0 10px #ffd34d)}}
#hitmarker{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;opacity:0;background:linear-gradient(45deg,transparent 46%,#fff 46% 54%,transparent 54%),linear-gradient(-45deg,transparent 46%,#fff 46% 54%,transparent 54%);-webkit-mask:radial-gradient(circle,transparent 5px,#000 6px);mask:radial-gradient(circle,transparent 5px,#000 6px)}
#hitmarker.hs{filter:drop-shadow(0 0 3px var(--acc)) hue-rotate(0);background:linear-gradient(45deg,transparent 44%,var(--acc) 44% 56%,transparent 56%),linear-gradient(-45deg,transparent 44%,var(--acc) 44% 56%,transparent 56%)}
#hud-fps{position:absolute;left:calc(8px + env(safe-area-inset-left));top:calc(6px + env(safe-area-inset-top));font-size:12px;color:var(--ok)}
#hud-dead{position:absolute;left:50%;top:62%;transform:translateX(-50%);font-size:18px;color:#ffb3ba;text-shadow:0 2px 8px #000}
#hud-hint{position:absolute;left:50%;bottom:86px;transform:translateX(-50%);font-size:13px;color:#cfd8e6;background:rgba(10,14,22,.6);padding:4px 12px;border-radius:99px}
#range-panel{position:absolute;left:calc(14px + env(safe-area-inset-left));top:calc(34px + env(safe-area-inset-top));pointer-events:auto;display:flex;gap:6px}
/* ── scoreboard */
#scoreboard{position:absolute;inset:0;z-index:15;background:rgba(5,8,14,.78);display:flex;align-items:center;justify-content:center;pointer-events:none}
#scoreboard .card{width:min(920px,96vw);max-height:92vh;overflow:auto}#scoreboard tr.me td{background:rgba(255,210,63,.08)}#scoreboard h3.a{color:var(--ally)}#scoreboard h3.e{color:var(--enemy)}
/* ── 매치 종료 시네마틱 */
#stage canvas,#hud{transition:filter .5s}
body.mfx-lose #stage canvas,body.mfx-lose #hud{filter:saturate(.1) brightness(.58) contrast(1.12);transition:filter 1.3s ease-out}
#match-fx{position:absolute;inset:0;z-index:38;overflow:hidden;display:flex;align-items:center;justify-content:center}
#match-fx canvas{position:absolute;inset:0;width:100%;height:100%}
.mfx-bg{position:absolute;inset:0;animation:mfxFade .6s ease-out both}
.mfx-rays{position:absolute;inset:-60%;display:none}
.mfx-flash{position:absolute;left:50%;top:50%;width:60vmin;height:60vmin;margin:-30vmin 0 0 -30vmin;border-radius:50%;display:none}
.mfx-text{position:relative;text-align:center;transition:opacity .45s,transform .45s}
#mfx-title{position:relative;font-size:clamp(52px,13vw,176px);font-weight:900;letter-spacing:.12em;padding-left:.12em;line-height:1;white-space:nowrap}
#mfx-sub{margin-top:14px;font-size:clamp(18px,3vw,34px);font-weight:800;letter-spacing:.4em;padding-left:.4em;animation:mfxSub .6s .55s ease-out both}
#match-fx.out .mfx-text{opacity:0;transform:translateY(-8vh) scale(.86)}#match-fx.out .mfx-rays{opacity:.45;transition:opacity .6s}
/* 승리: 시안 + 골드 빛 확산 */
#match-fx.win .mfx-bg{background:radial-gradient(62% 56% at 50% 50%,rgba(0,245,212,.36),rgba(255,210,63,.15) 46%,rgba(5,8,14,.74) 100%)}
#match-fx.win .mfx-rays{display:block;background:repeating-conic-gradient(from 0deg,rgba(0,245,212,.17) 0 6deg,transparent 6deg 18deg,rgba(255,210,63,.14) 18deg 23deg,transparent 23deg 36deg);-webkit-mask-image:radial-gradient(closest-side,#000 0,transparent 78%);mask-image:radial-gradient(closest-side,#000 0,transparent 78%);animation:mfxSpin 46s linear infinite}
#match-fx.win .mfx-flash{display:block;background:radial-gradient(circle,#fff 0,rgba(0,245,212,.85) 28%,rgba(255,210,63,.45) 54%,transparent 70%);animation:mfxFlash 1.1s cubic-bezier(.1,.7,.2,1) both}
#match-fx.win #mfx-title{background:linear-gradient(100deg,#00f5d4 5%,#eafffb 42%,#ffe98a 62%,#ffd23f 95%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(0,245,212,.6)) drop-shadow(0 0 54px rgba(255,210,63,.4));animation:mfxZoom .95s cubic-bezier(.16,.9,.24,1) both}
#match-fx.win #mfx-sub{color:#ffe9a6;text-shadow:0 0 16px rgba(255,210,63,.7)}
/* 패배: 다크 레드 비네트 + 글리치 */
#match-fx.lose .mfx-bg{background:radial-gradient(ellipse at center,rgba(20,0,3,.2) 24%,rgba(96,6,16,.58) 66%,rgba(26,0,4,.95) 100%);animation-duration:1.1s}
#match-fx.lose #mfx-title{color:#e3d6d7;text-shadow:0 0 26px rgba(255,30,50,.55),0 4px 0 rgba(0,0,0,.6);animation:mfxSlam .7s cubic-bezier(.2,.9,.3,1) both,mfxShake 2.6s .7s steps(1) infinite}
#match-fx.lose #mfx-title::before,#match-fx.lose #mfx-title::after{content:attr(data-text);position:absolute;inset:0;padding-left:.12em;pointer-events:none}
#match-fx.lose #mfx-title::before{color:#ff1f3d;text-shadow:none;animation:mfxGlitchA 1.7s steps(1) infinite}
#match-fx.lose #mfx-title::after{color:#6fd6e6;text-shadow:none;opacity:.75;animation:mfxGlitchB 2.3s steps(1) infinite}
#match-fx.lose #mfx-sub{color:#c98b92}
#match-fx.draw .mfx-bg{background:radial-gradient(ellipse at center,rgba(40,52,74,.5),rgba(5,8,14,.86) 80%)}
#match-fx.draw #mfx-title{color:#dfe6f2;text-shadow:0 0 24px rgba(160,190,255,.45);animation:mfxZoom .9s cubic-bezier(.16,.9,.24,1) both}
@keyframes mfxFade{from{opacity:0}to{opacity:1}}
@keyframes mfxSpin{to{transform:rotate(360deg)}}
@keyframes mfxFlash{0%{transform:scale(.08);opacity:1}100%{transform:scale(4.6);opacity:0}}
@keyframes mfxZoom{0%{transform:scale(3.6);opacity:0}50%{transform:scale(.93);opacity:1}72%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes mfxSub{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes mfxSlam{0%{transform:scale(1.5) translateY(-30px);opacity:0}60%{transform:scale(.97) translateY(4px);opacity:1}100%{transform:none}}
@keyframes mfxShake{0%,100%{transform:none}8%{transform:translate(-5px,2px) skewX(-4deg)}10%{transform:translate(4px,-1px)}12%{transform:none}54%{transform:translate(3px,1px) skewX(3deg)}56%{transform:none}}
@keyframes mfxGlitchA{0%,100%{clip-path:inset(0 0 100% 0);transform:none}6%{clip-path:inset(12% 0 62% 0);transform:translate(-9px,0)}11%{clip-path:inset(58% 0 20% 0);transform:translate(7px,0)}16%{clip-path:inset(0 0 100% 0)}47%{clip-path:inset(34% 0 44% 0);transform:translate(11px,0)}52%{clip-path:inset(78% 0 6% 0);transform:translate(-6px,0)}57%{clip-path:inset(0 0 100% 0)}82%{clip-path:inset(4% 0 82% 0);transform:translate(5px,0)}86%{clip-path:inset(0 0 100% 0)}}
@keyframes mfxGlitchB{0%,100%{clip-path:inset(0 0 100% 0);transform:none}9%{clip-path:inset(66% 0 14% 0);transform:translate(8px,0)}14%{clip-path:inset(22% 0 60% 0);transform:translate(-10px,0)}19%{clip-path:inset(0 0 100% 0)}63%{clip-path:inset(46% 0 36% 0);transform:translate(-7px,0)}68%{clip-path:inset(0 0 100% 0)}}
/* ── 매치 결과 화면 (다크 글래스모피즘) */
#m-result{background:rgba(5,8,14,.36)}
#m-result>.card{width:min(1040px,96vw);gap:12px;background:rgba(13,19,31,.6);-webkit-backdrop-filter:blur(18px) saturate(1.25);backdrop-filter:blur(18px) saturate(1.25);border:1px solid rgba(255,255,255,.13);box-shadow:0 24px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.09);animation:resIn .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes resIn{from{opacity:0;transform:translateY(26px) scale(.97)}to{opacity:1;transform:none}}
#res-body{gap:12px}
.res-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.res-verdict b{display:block;font-size:26px;font-weight:900;letter-spacing:.14em}.res-verdict small{color:var(--mut);font-size:12px}
.res-verdict.win b{color:#00f5d4;text-shadow:0 0 18px rgba(0,245,212,.5)}.res-verdict.lose b{color:#ff5b6b}
.res-score{display:flex;align-items:center;gap:16px;font-size:46px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.res-score .t{display:flex;flex-direction:column;align-items:center;gap:4px}.res-score small{font-size:11px;letter-spacing:.18em;color:var(--mut);font-weight:700}.res-score i{font-style:normal;color:var(--mut);font-size:28px}
.res-score .t.w b{color:#00f5d4;text-shadow:0 0 20px rgba(0,245,212,.65)}.res-score .t.w small{color:var(--gold)}.res-score .t.l b{opacity:.45}
.res-credit{text-align:right;font-variant-numeric:tabular-nums}.res-credit small{display:block;color:var(--mut);font-size:11px;letter-spacing:.14em}
#res-credits{display:inline-block;font-size:30px;font-weight:900;color:var(--gold);text-shadow:0 0 16px rgba(255,210,63,.45)}#res-credits.pop{animation:creditPop .45s ease-out}
@keyframes creditPop{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1)}}
#res-reward{font-size:12px;min-height:16px}
.mvp-card{position:relative;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 18px;border-radius:12px;border:1px solid rgba(255,210,63,.55);background:linear-gradient(110deg,rgba(255,210,63,.2),rgba(0,245,212,.08) 62%,rgba(255,255,255,.02));box-shadow:0 0 30px rgba(255,210,63,.16);overflow:hidden}
.mvp-card::after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:30%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.2),transparent);animation:mvpShine 3.2s 1s ease-in-out infinite}
@keyframes mvpShine{0%{left:-40%}45%,100%{left:120%}}
.mvp-crown{font-size:44px;line-height:1;filter:drop-shadow(0 0 12px rgba(255,210,63,.85));animation:mvpCrown 2.4s ease-in-out infinite}
@keyframes mvpCrown{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-5px) rotate(5deg)}}
.mvp-tag{font-size:11px;letter-spacing:.32em;color:var(--gold);font-weight:800}.mvp-name{font-size:24px;font-weight:900}
.mvp-stats{display:flex;gap:20px;margin-left:auto;flex-wrap:wrap}.mvp-stats div{text-align:center}.mvp-stats b{display:block;font-size:20px;font-variant-numeric:tabular-nums}.mvp-stats small{color:var(--mut);font-size:11px}
.res-teams{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.res-team{min-width:0;border:1px solid rgba(255,255,255,.09);border-radius:10px;padding:10px 10px 4px;background:rgba(6,10,18,.4);overflow-x:auto}
.res-team h4{margin:0 0 4px;display:flex;align-items:center;gap:8px;font-size:14px}.res-team.ally h4{color:var(--ally)}.res-team.enemy h4{color:var(--enemy)}.res-team h4 b{margin-left:auto;font-size:20px}
.res-team th,.res-team td{white-space:nowrap;border-bottom-color:rgba(255,255,255,.07);font-variant-numeric:tabular-nums}.res-team tr:last-child td{border-bottom:none}
.res-team tr.me td{background:rgba(0,245,212,.13)}.res-team tr.me td:first-child{box-shadow:inset 3px 0 0 #00f5d4}
.bdg{display:inline-block;font-size:10px;font-weight:800;border-radius:3px;padding:1px 5px;margin-left:6px;vertical-align:middle}.bdg.m{background:var(--gold);color:#000}.bdg.t{border:1px solid var(--acc2);color:var(--acc2)}.bdg.w{background:rgba(0,245,212,.18);color:#00f5d4}
#res-ok{align-self:center;min-width:240px;padding:11px 26px;font-size:15px;letter-spacing:.06em}
@media (max-width:820px){.res-teams{grid-template-columns:1fr}.res-top{grid-template-columns:1fr;justify-items:center;text-align:center}.res-credit{text-align:center}.res-score{font-size:36px}.mvp-stats{margin-left:0}}
@media (prefers-reduced-motion:reduce){#match-fx *,#match-fx *::before,#match-fx *::after,.mvp-card::after,.mvp-crown{animation-duration:.01s!important;animation-iteration-count:1!important}}
/* ── loadout */
#loadout{position:absolute;z-index:30;left:50%;top:50%;transform:translate(-50%,-50%);width:min(720px,96vw);max-height:92vh;overflow:auto;touch-action:pan-y}
.ld-row{display:grid;grid-template-columns:90px 1fr;gap:8px;align-items:start;padding:6px 0}.ld-opts{display:flex;gap:6px;flex-wrap:wrap}
.ld-opts button{min-width:92px;text-align:left}.ld-opts button small{display:block;color:var(--mut);font-size:11px}.ld-opts button.on{border-color:var(--acc);background:#2a1a22}
/* ── touch */
#touch{position:absolute;inset:0;z-index:12;pointer-events:none}
#joy-zone{position:absolute;left:0;top:18%;bottom:0;width:42%;pointer-events:auto}#aim-zone{position:absolute;right:0;top:12%;bottom:0;width:58%;pointer-events:auto}
#joy-base{position:absolute;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.06);left:calc(36px + env(safe-area-inset-left));bottom:calc(36px + env(safe-area-inset-bottom))}
#joy-knob{position:absolute;left:50%;top:50%;width:46%;height:46%;margin:-23% 0 0 -23%;border-radius:50%;background:rgba(255,255,255,.5)}
.tbtn{position:absolute;pointer-events:auto;width:58px;height:58px;border-radius:50%;border:2px solid rgba(255,255,255,.45);background:rgba(20,26,38,.5);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff;transform:scale(var(--ts,1));opacity:var(--to,.6)}
.tbtn.down{background:rgba(255,255,255,.35)}.tbtn.big{width:84px;height:84px;font-size:15px;border-color:var(--acc)}
#t-fire{right:calc(34px + env(safe-area-inset-right));bottom:calc(74px + env(safe-area-inset-bottom))}#t-ads{right:calc(132px + env(safe-area-inset-right));bottom:calc(46px + env(safe-area-inset-bottom))}
#t-jump{right:calc(30px + env(safe-area-inset-right));bottom:calc(172px + env(safe-area-inset-bottom))}#t-slide{right:calc(126px + env(safe-area-inset-right));bottom:calc(120px + env(safe-area-inset-bottom))}
#t-x{right:calc(284px + env(safe-area-inset-right));bottom:calc(60px + env(safe-area-inset-bottom))}
#t-q{right:calc(202px + env(safe-area-inset-right));bottom:calc(30px + env(safe-area-inset-bottom))}#t-e{right:calc(204px + env(safe-area-inset-right));bottom:calc(104px + env(safe-area-inset-bottom))}
#t-reload{right:calc(100px + env(safe-area-inset-right));bottom:calc(200px + env(safe-area-inset-bottom));width:46px;height:46px}
#t-auto{right:calc(18px + env(safe-area-inset-right));top:calc(120px + env(safe-area-inset-top));width:auto;height:34px;border-radius:99px;padding:0 12px;font-size:11px}#t-auto.on{border-color:var(--ok);color:var(--ok)}
#t-menu,#t-load{top:calc(8px + env(safe-area-inset-top));width:40px;height:40px;font-size:11px}#t-menu{left:calc(64px + env(safe-area-inset-left))}#t-load{left:calc(112px + env(safe-area-inset-left))}
body.left #joy-base{left:auto;right:calc(36px + env(safe-area-inset-right))}
/* ── misc */
#toasts{position:absolute;left:50%;top:70px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:#1d2637;border:1px solid var(--line);padding:8px 16px;border-radius:8px;font-size:14px}.toast.bad{border-color:var(--acc)}.toast.good{border-color:var(--ok)}
#rotate-hint{display:none;position:absolute;inset:0;z-index:80;background:var(--bg);align-items:center;justify-content:center;text-align:center;font-size:18px;line-height:1.6}
@media (orientation:portrait) and (pointer:coarse){body.ingame #rotate-hint{display:flex}}
</style>
</head>
<body>
<div id="app">
  <div id="stage" tabindex="-1"></div>
  <canvas id="xhair"></canvas>

  <!-- 인게임 HUD -->
  <div id="hud" class="hidden">
    <div id="hud-fps" class="hidden"></div>
    <div id="hud-top"><span class="s" id="hud-sa">0</span><div id="hud-mid"><div id="hud-timer">0:00</div><div id="hud-goal"></div></div><span class="s" id="hud-sb">0</span></div>
    <div id="range-panel" class="hidden"><button class="sm" id="range-move">봇 이동: OFF</button><button class="sm" id="range-load">무기 변경</button><button class="sm" id="range-exit">나가기</button></div>
    <div id="killfeed"></div>
    <div id="hud-banner"></div>
    <div id="hitmarker"></div>
    <div id="killbanner"></div>
    <div id="hud-dead" class="hidden">사망 — 다음 스폰을 기다리는 중</div>
    <div id="hud-hint" class="hidden"></div>
    <div id="hud-bl"><div><div id="hud-hp">150</div><div id="hud-hpbar"><i></i></div></div></div>
    <div id="hud-skills">
      <div class="sk" id="sk-q"><span>Q</span><b></b><small></small><i></i></div>
      <div class="sk" id="sk-e"><span>E</span><b></b><small></small><i></i></div>
      <div class="sk ult" id="sk-x"><span>X</span><b></b><small></small><i></i></div>
    </div>
    <div id="hud-ult"><div id="ult-pips"></div><div id="ult-name"></div></div>
    <div id="hud-status"></div>
    <div id="hud-cast" class="hidden"><div id="cast-label"></div><div id="cast-bar"><i></i></div></div>
    <div id="hud-br"><div id="hud-ammo">0</div><div id="hud-weapon"></div><div id="hud-slots"><div data-slot="1">1 주무기</div><div data-slot="2">2 보조</div><div data-slot="3">3 근접</div><div data-slot="4">4 투척</div></div></div>
  </div>

  <!-- 모바일 듀얼 터치 HUD -->
  <div id="touch" class="hidden">
    <div id="joy-zone"><div id="joy-base"><div id="joy-knob"></div></div></div>
    <div id="aim-zone"></div>
    <div class="tbtn" id="t-menu">메뉴</div><div class="tbtn" id="t-load">무기</div>
    <div class="tbtn" id="t-auto">Auto-Fire OFF</div>
    <div class="tbtn" id="t-reload" data-act="reload">R</div>
    <div class="tbtn" id="t-q" data-act="updraft">Q</div><div class="tbtn" id="t-e" data-act="dash">E</div><div class="tbtn" id="t-x" data-act="ult">X</div>
    <div class="tbtn" id="t-slide" data-act="slide">슬라</div><div class="tbtn" id="t-jump" data-act="jump">점프</div>
    <div class="tbtn" id="t-ads" data-act="alt">줌</div><div class="tbtn big" id="t-fire" data-act="fire">사격</div>
  </div>

  <!-- 매치 종료 시네마틱 (승리/패배) -->
  <div id="match-fx" class="hidden"><div class="mfx-bg"></div><div class="mfx-rays"></div><div class="mfx-flash"></div><canvas id="mfx-canvas"></canvas><div class="mfx-text"><div id="mfx-title"></div><div id="mfx-sub"></div></div></div>

  <div id="scoreboard" class="hidden"><div class="card" id="sb-body"></div></div>
  <div id="loadout" class="card hidden"></div>

  <!-- 로그인 -->
  <div id="auth" class="screen">
    <div class="card col">
      <div><h1>GRID<b>STRIKE</b></h1><div class="mut">링크 접속만으로 즐기는 웹 3D FPS</div></div>
      <div class="tabs"><button id="auth-tab-in" class="on">로그인</button><button id="auth-tab-up">회원가입</button></div>
      <input id="auth-id" placeholder="아이디 (영문 소문자·숫자 4~16자)" autocomplete="username" autocapitalize="off" />
      <input id="auth-pw" type="password" placeholder="비밀번호 (6자 이상)" autocomplete="current-password" />
      <input id="auth-nick" class="hidden" placeholder="닉네임 (2~16자)" />
      <div class="err" id="auth-err"></div>
      <button class="pri" id="auth-submit">로그인</button>
      <button class="google" id="auth-google">Continue with Google</button>
      <button class="ghost" id="auth-guest">게스트로 바로 플레이</button>
    </div>
  </div>

  <!-- 로비 -->
  <div id="lobby" class="screen hidden">
    <div id="lobby-top">
      <div class="row"><span class="chip" id="lb-nick"></span><span class="chip" id="lb-title"></span><span class="chip" id="lb-tier"></span></div>
      <button id="btn-play">[ 플레이 ]</button>
      <div class="row" style="justify-content:flex-end"><span class="chip" id="lb-credits"></span><span class="chip" id="lb-boxes"></span><button class="sm" id="btn-support">고객센터</button><button class="sm" id="btn-settings">설정</button><button class="sm ghost" id="btn-logout">로그아웃</button></div>
    </div>
    <div id="lobby-nav" class="tabs"></div>
    <div id="lobby-body"></div>
  </div>

  <!-- 사설 방 대기실 -->
  <div id="room" class="screen hidden"><div style="max-width:900px;margin:30px auto;padding:0 16px" id="room-body"></div></div>

  <!-- 모달 -->
  <div class="modal hidden" id="m-play"><div class="card"><div class="mh"><h3>게임 모드 선택</h3><button class="x" data-close>✕</button></div><div id="play-body"></div></div></div>
  <div class="modal hidden" id="m-settings"><div class="card"><div class="mh"><h3>설정</h3><button class="x" data-close>✕</button></div><div class="tabs" id="set-tabs"></div><div id="set-body" style="margin-top:12px"></div></div></div>
  <div class="modal hidden" id="m-nick"><div class="card sm col"><div class="mh"><h3>닉네임 변경</h3><button class="x" data-close>✕</button></div><div class="mut" id="nick-cost"></div><input id="nick-input" maxlength="16" placeholder="새 닉네임" /><div class="err" id="nick-err"></div><button class="pri" id="nick-ok">변경</button></div></div>
  <div class="modal hidden" id="m-gacha"><div class="card"><div class="mh"><h3 id="gacha-title">랜덤 박스</h3><button class="x" data-close>✕</button></div><div id="gacha-win"><div id="gacha-strip"></div></div><div id="gacha-result"></div></div></div>
  <div class="modal hidden" id="m-support"><div class="card"><div class="mh"><h3 id="sup-title">고객센터</h3><button class="x" data-close>✕</button></div><div id="sup-body"></div><div id="sup-foot"><input id="sup-input" maxlength="500" placeholder="불편 사항이나 건의 내용을 입력하세요" autocomplete="off" /><button class="pri" id="sup-send">전송</button></div></div></div>
  <div class="modal hidden" id="m-login"><div class="card sm col"><div class="mh"><h3>7일 연속 로그인 보상</h3><button class="x" data-close>✕</button></div><div id="login-body"></div><button class="pri" data-close>확인</button></div></div>
  <div class="modal hidden" id="tacmap"><div class="card"><div class="mh"><h3>전술 맵 — 이동할 위치를 클릭 (그림자 습격)</h3><button class="x" id="tac-close">✕</button></div><canvas id="tac-canvas" width="640" height="640"></canvas><div class="mut" style="margin-top:6px;font-size:12px">시전 시간 1.5초 · 시전 중 피격되면 취소됩니다. 흰 점 = 내 위치</div></div></div>
  <div class="modal hidden" id="m-result"><div class="card col"><div id="res-body" class="col"></div><button class="pri" id="res-ok">로비로 돌아가기</button></div></div>
  <div class="modal hidden" id="m-pause"><div class="card sm col"><div class="mh"><h3>일시 메뉴</h3></div><button class="pri" id="pause-resume">계속하기</button><button id="pause-load">무기 변경</button><button id="pause-settings">설정</button><button class="ghost" id="pause-leave">게임 나가기</button></div></div>

  <div id="toasts"></div>
  <div id="rotate-hint"><div>📱↻<br />가로 화면으로 돌려 주세요</div></div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
